project:
  type: website
  output-dir: "docs"       
  render:
    - era-classifier.qmd
    - index.qmd
    - visualizations.qmd
    - results.qmd

website:
  title: "Sonic Time Travelers"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Visualizations"
        href: visualizations.qmd
      - text: "Model Implementation"
        href: era-classifier.qmd
      - text: "Results Summary"
        href: results.qmd
    right:
      - text: "📄 Download Report"
        href: results.pdf
        target: _blank
      - icon: github
        href: https://github.com/phuonganhdangamy/jsc370-project
  page-footer:
    center: "Amy Dang | JSC370 | University of Toronto | 2026"

format:
  html:
    theme: [cosmo, styles.css]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-fold: true
    code-summary: "Show code"

execute:
  echo: true
  warning: false
  message: false

jupyter: jsc370-venv